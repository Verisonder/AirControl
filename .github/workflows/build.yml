name: Build AirControl

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble bundle + build installer .exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "3.12.7"

          # 1) bundled Python runtime
          Invoke-WebRequest "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip" -OutFile embed.zip
          New-Item -ItemType Directory -Force -Path AirControl | Out-Null
          Expand-Archive embed.zip -DestinationPath AirControl -Force
          $pth = (Get-ChildItem AirControl\python*._pth)[0].FullName
          (Get-Content $pth) -replace '#\s*import site','import site' | Set-Content $pth
          Add-Content $pth "Lib\site-packages"

          # 2) pip only - the libraries are fetched on first run, since bundling
          #    PySide6, MediaPipe and OpenCV would make this a 400 MB download
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          .\AirControl\python.exe get-pip.py --no-warn-script-location
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed" }
          .\AirControl\python.exe -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "pip is not usable" }
          # setuptools up front - the embedded runtime has none, and any package
          # without a ready-made wheel cannot be built without it
          .\AirControl\python.exe -m pip install --no-warn-script-location setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "setuptools did not install" }

          # 3) app files
          Copy-Item launch.py, setup_deps.py, gui.py, aircontrol.py, record.py, preview.py, fingers.py, hands.py, gestures.py, actions.py AirControl\
          Copy-Item aircontrol.ico AirControl\
          New-Item -ItemType File -Path AirControl\installed.txt -Force | Out-Null

          # 4) sanity check - every file the shortcut needs must be there
          foreach ($f in @("python.exe","pythonw.exe","launch.py","gui.py","hands.py","gestures.py","actions.py","aircontrol.py","setup_deps.py","aircontrol.ico")) {
            if (-not (Test-Path "AirControl\$f")) { throw "missing from bundle: $f" }
          }

          # 5) build the installer with Inno Setup
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup did not install" }
          $appver = (Get-Content VERSION).Trim()
          $iss = @"
          [Setup]
          AppName=AirControl
          AppVersion=$appver
          DefaultDirName={localappdata}\AirControl
          DisableProgramGroupPage=yes
          DisableWelcomePage=no
          PrivilegesRequired=lowest
          OutputBaseFilename=AirControl-Setup
          SetupIconFile=aircontrol.ico
          UninstallDisplayIcon={app}\aircontrol.ico
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          WizardSizePercent=100
          WizardResizable=yes
          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop shortcut"; GroupDescription: "Additional shortcuts:"
          [Files]
          Source: "AirControl\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs
          [Icons]
          Name: "{userdesktop}\AirControl"; Filename: "{app}\pythonw.exe"; Parameters: """{app}\launch.py"""; IconFilename: "{app}\aircontrol.ico"; WorkingDir: "{app}"; Tasks: desktopicon
          Name: "{userprograms}\AirControl"; Filename: "{app}\pythonw.exe"; Parameters: """{app}\launch.py"""; IconFilename: "{app}\aircontrol.ico"; WorkingDir: "{app}"
          Name: "{userprograms}\Repair AirControl"; Filename: "{app}\pythonw.exe"; Parameters: """{app}\setup_deps.py"" --quiet"; IconFilename: "{app}\aircontrol.ico"; WorkingDir: "{app}"
          [Run]
          Filename: "{app}\pythonw.exe"; Parameters: """{app}\launch.py"""; Description: "Start AirControl"; Flags: nowait postinstall skipifsilent
          [Code]
          procedure CurStepChanged(CurStep: TSetupStep);
          var
            ResultCode: Integer;
          begin
            if CurStep = ssPostInstall then
            begin
              WizardForm.StatusLabel.Caption :=
                'Downloading libraries (about 400 MB). This can take several minutes...';
              WizardForm.FilenameLabel.Caption := 'Nothing is frozen - the bar cannot show progress for this.';
              // The bar tracks file copying, which is already finished. Sweeping
              // it says "still working" instead of sitting at a misleading 100%.
              WizardForm.ProgressGauge.Style := npbstMarquee;
              try
                Exec(ExpandConstant('{app}\pythonw.exe'),
                     ExpandConstant('"{app}\setup_deps.py" --quiet'),
                     ExpandConstant('{app}'), SW_HIDE, ewWaitUntilTerminated, ResultCode);
              finally
                WizardForm.ProgressGauge.Style := npbstNormal;
                WizardForm.FilenameLabel.Caption := '';
              end;
            end;
          end;
          "@
          Set-Content -Path aircontrol.iss -Value $iss -Encoding ASCII
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" aircontrol.iss
          if (-not (Test-Path "Output\AirControl-Setup.exe")) { throw "installer was not produced" }
          "Installer size: {0:N1} MB" -f ((Get-Item Output\AirControl-Setup.exe).Length / 1MB)

      - name: Publish installer to Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/AirControl-Setup.exe
          generate_release_notes: true
